name: ZenithenOpen CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Backend & Unit Test Suites
        run: npm test
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: test
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/zenithen_test?schema=public"
          UPSTASH_REDIS_REST_URL: "https://mock.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "mock_token"
          GITHUB_TOKEN: "ghp_mock_token_for_ci_test_suite_execution"

      - name: Production Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

